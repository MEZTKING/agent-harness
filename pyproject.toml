[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roundtable-hold"
version = "1.4.0"
description = "Roundtable Hold: the best AI models working together - a cross-repo hub with project journals, a role-routed multi-provider project harness, self-improvement and a web UI."
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6",
  "mcp>=2.0",
  "anthropic>=2.0",
  "openai>=2.0",
  "cryptography>=42",  # phone access: the self-signed TLS certificate
  "segno>=1.5",        # phone access: the pairing QR code
  "pillow>=10",        # named agents: a face shrunk to a small square webp (agents.py)
  "pypdf>=4",          # the text of a PDF, for search and the Files tab (documents.py)
  "tzdata; sys_platform == 'win32'",  # Windows has no time-zone database: schedules keep summer time
]

[project.optional-dependencies]
dev = ["pytest>=8", "pillow>=10"]   # pillow: the picture tests (proof, play-testing); also a runtime need now
desktop = ["pywebview>=5", "keyring>=24", "pytest>=8"]   # pytest: the app's own Python runs checks with it (packaging/roundtable.spec)

[project.scripts]
roundtable = "roundtable.main:main"
darkness = "roundtable.main:main"         # the same command under the new name
agent-hub = "roundtable.cli:main"        # alias: hub commands only
harness = "roundtable.harness_cli:main"  # alias: harness commands only
roundtable-app = "roundtable.desktop:main"  # the desktop app (from source)

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roundtable = ["templates/*.yaml", "prompts/*.md", "ui/static/*", "ui/static/agents/*", "kinds/builtin/**/*",
              "improve/yardsticks/**/*", "plugins/catalogue.json", "skills/builtin/**/*",
              "mcp_catalogue.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
