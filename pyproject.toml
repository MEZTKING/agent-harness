[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentharness"
version = "0.1.0"
description = "Multi-provider agent harness: a cross-repo communication hub plus a role-routed project harness."
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6",
  "mcp>=2.0",
  "anthropic>=2.0",
  "openai>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agent-hub = "agentharness.cli:main"
harness = "agentharness.harness_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentharness = ["templates/*.yaml", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
