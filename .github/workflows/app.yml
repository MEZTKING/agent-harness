name: Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v0.3.0); must match the app version. Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write  # attach the installer to releases

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Git identity for tests
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@localhost"
          git config --global init.defaultBranch main
      - name: Run tests
        run: python -m pytest -q

  android-apk:
    name: Build phone APK (test build)
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build the test APK (signed with mobile/test-key, so it installs over the last one)
        working-directory: mobile
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' ../pyproject.toml)
          mkdir -p ../dist && cp app/build/outputs/apk/debug/app-debug.apk "../dist/RoundtableMobile-$version-test.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: RoundtableMobile-test-apk
          path: dist/RoundtableMobile-*-test.apk

  windows-app:
    name: Build Windows installer
    needs: [tests, android-apk]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install -e ".[desktop]" pyinstaller
      - name: Version
        id: version
        shell: bash
        run: echo "value=$(python -c 'import roundtable; print(roundtable.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Build app
        run: pyinstaller packaging/roundtable.spec --noconfirm
      - name: Self-test the built app
        timeout-minutes: 3
        shell: pwsh
        run: |
          $env:ROUNDTABLE_HOME = "$env:RUNNER_TEMP\rt-built"
          $p = Start-Process -FilePath dist\RoundtableHold\RoundtableHold.exe -ArgumentList "--self-test" -PassThru
          $p.WaitForExit()
          Get-Content "$env:ROUNDTABLE_HOME\logs\self-test.json"
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.value }}" packaging\installer.iss
      - name: Install silently and self-test the installed app
        timeout-minutes: 5
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\RoundtableHold-Setup-*.exe | Select-Object -First 1
          # wait for the installer process only (-Wait would also wait for anything it launches)
          $inst = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/NOLAUNCH=1","/DIR=$env:RUNNER_TEMP\rt-install" -PassThru
          $inst.WaitForExit()
          if ($inst.ExitCode -ne 0) { throw "installer failed with exit code $($inst.ExitCode)" }
          if (-not (Test-Path "$env:RUNNER_TEMP\rt-install\RoundtableHold.exe")) { throw "app not installed" }
          Get-Process RoundtableHold -ErrorAction SilentlyContinue | Stop-Process -Force
          $env:ROUNDTABLE_HOME = "$env:RUNNER_TEMP\rt-installed"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\rt-install\RoundtableHold.exe" -ArgumentList "--self-test" -PassThru
          $p.WaitForExit()
          Get-Content "$env:ROUNDTABLE_HOME\logs\self-test.json"
          if ($p.ExitCode -ne 0) { throw "installed app self-test failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: RoundtableHold-Setup-${{ steps.version.outputs.value }}
          path: dist/RoundtableHold-Setup-*.exe
      - name: Check release tag matches the app version
        if: inputs.release_tag != ''
        shell: bash
        run: |
          if [ "${{ inputs.release_tag }}" != "v${{ steps.version.outputs.value }}" ]; then
            echo "release_tag ${{ inputs.release_tag }} does not match app version v${{ steps.version.outputs.value }}"; exit 1
          fi
      - name: Fetch the phone APK
        uses: actions/download-artifact@v4
        with:
          name: RoundtableMobile-test-apk
          path: dist
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Roundtable Hold ${{ steps.version.outputs.value }}
          files: |
            dist/RoundtableHold-Setup-*.exe
            dist/RoundtableMobile-*-test.apk
          generate_release_notes: true
