# Roundtable configuration: who does what.
# Model references are "<provider>/<model>". Swap any of them freely.

providers:
  anthropic:
    type: anthropic                 # native Claude SDK
    api_key_env: ANTHROPIC_API_KEY
  deepseek:
    type: openai_compat             # any OpenAI-compatible API
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
  openai:
    type: openai_compat
    api_key_env: OPENAI_API_KEY
  openai_images:
    type: openai_images
    api_key_env: OPENAI_API_KEY
  retrodiffusion:                   # pixel art (retrodiffusion.ai), priced per image
    type: retrodiffusion
    api_key_env: RETRODIFFUSION_API_KEY
  gemini:
    type: openai_compat
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
  openrouter_images:                # picture models through OpenRouter (GPT Image, Nano Banana), exact cost per picture
    type: chat_images
    api_key_env: OPENROUTER_API_KEY
  openference:                      # one key for 55 models from 15 makers (Claude, GPT, Gemini, GLM, Kimi...)
    type: openai_compat
    base_url: https://api.openference.com/v1
    api_key_env: OPENFERENCE_API_KEY
  openrouter:                       # every top model from every maker; exact cost and balance are read from it
    type: openai_compat
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
  # local:      {type: openai_compat, base_url: http://localhost:11434/v1}   # Ollama

# Who does what: the recommended split (Openference plus a DeepSeek key). Claude plans and
# designs, DeepSeek writes the code (cheapest bought direct), and each check is done by a
# different maker's model. Every chat role ends on DeepSeek, so a DeepSeek key alone is enough
# to start; add the Openference and OpenRouter keys in Settings for the full split.
# Change any of it in the app (Models), or press "Use the recommended setup" in Settings to
# come back to this.
roles:
  orchestrator:                     # plans the project and writes the final report
    model: "openference/Claude Opus 5.5"
    fallback: [openrouter/z-ai/glm-5.3, deepseek/deepseek-v4-flash]
  manager:
    model: "openference/Claude Sonnet 5.5"
    fallback: [deepseek/deepseek-v4-flash]
    description: specs, architecture and API documents, READMEs, project coordination
  critic:                           # a second opinion on every new plan, from another maker's model
    model: "openference/GPT-6.1 Terra"
    fallback: [openference/GLM-5.3, deepseek/deepseek-v4-flash]
  designer:                         # designs the app's looks to choose from (a model that can see pictures)
    model: "openference/Claude Sonnet 5.5"
    fallback: [openference/GLM-5.3, deepseek/deepseek-v4-flash]
    max_tokens: 32000                 # three mockup pages in one answer
  coder:
    model: deepseek/deepseek-v4-flash
    fallback: [openrouter/z-ai/glm-5.3]
    description: writes and tests code
  scout:                            # reads the pages and repositories you want it to be like ("Make it like this")
    model: deepseek/deepseek-v4-flash
    fallback: [openference/GLM-5.3]
  stylist:
    model: openrouter/anthropic/claude-sonnet-5.5
    fallback: [openrouter/z-ai/glm-5.3, deepseek/deepseek-v4-flash]
    description: visual styling of screens
  reviewer:                         # checks every task against its acceptance criteria
    model: "openference/GPT-6 Luna"
    fallback: ["openference/Claude Haiku 5.5", deepseek/deepseek-v4-flash]
  illustrator:                      # pictures: art, backgrounds, icons
    kind: image
    model: openrouter_images/google/gemini-3.1-flash-image
    options: {aspect_ratio: "16:9"}
    description: pictures - art, backgrounds, icons
  # artist:                         # pixel-art game assets (needs a Retro Diffusion key); model = default style
  #   kind: image
  #   model: retrodiffusion/rd_lite__default
  #   options: {width: 64, height: 64}
  #   description: >-
  #     pixel-art game assets. Set image_options.style per task, e.g. rd_core__platformer (side-view
  #     sprites), rd_core__topdown, rd_core__isometric, rd_plus__item_sheet, rd_plus__ui_element,
  #     rd_tile__single_tile (16-64px tiles), rd_plus__skill_icon, rd_core__fantasy; width/height in
  #     pixels (usually 32-128); remove_bg true for sprites, tile_x/tile_y for seamless backgrounds.
  # illustrator (OpenAI direct):    # non-pixel images
  #   kind: image
  #   model: openai_images/gpt-image-1
  #   options: {size: 1024x1024}
  # writer:
  #   model: gemini/<current-gemini-model>
  #   description: marketing copy and long-form content
  #   prompt: worker                # any file in prompts_dir, or a built-in prompt name

# Settings a project can switch between (Budget / Balanced / Quality), each laid over the roles
# above. The plan shows what each would cost; switch from the app or the phone.
profiles:
  budget:
    description: cheapest that still works; open models
    roles:
      orchestrator: {model: openrouter/z-ai/glm-5.3, fallback: [deepseek/deepseek-v4-flash]}
      critic: {model: openference/GLM-5.3, fallback: [deepseek/deepseek-v4-flash]}
      designer: {model: openference/GLM-5.3, fallback: [openrouter/z-ai/glm-5.3, deepseek/deepseek-v4-flash]}
      coder: {model: deepseek/deepseek-v4-flash, fallback: [openrouter/z-ai/glm-5.3]}
      reviewer: {model: "openference/GPT-6 Luna", fallback: [deepseek/deepseek-v4-flash]}
  balanced:
    description: Claude plans and designs, other makers check, DeepSeek codes
    roles:
      orchestrator: {model: "openference/Claude Opus 5.5", fallback: [openrouter/z-ai/glm-5.3, deepseek/deepseek-v4-flash]}
      critic: {model: "openference/GPT-6.1 Terra", fallback: [openference/GLM-5.3, deepseek/deepseek-v4-flash]}
      designer: {model: openrouter/anthropic/claude-sonnet-5.5, fallback: ["openference/Claude Sonnet 5.5", deepseek/deepseek-v4-flash]}
      coder: {model: deepseek/deepseek-v4-flash, fallback: [openrouter/z-ai/glm-5.3]}
      reviewer: {model: openrouter/openai/gpt-6.1-terra, fallback: [openrouter/anthropic/claude-sonnet-5.5, deepseek/deepseek-v4-flash]}
  quality:
    description: the strongest model for every job
    roles:
      illustrator: {model: openrouter_images/openai/gpt-5.4-image-2, fallback: [openrouter_images/google/gemini-3.1-flash-image]}
      orchestrator: {model: openrouter/anthropic/claude-opus-5.5, fallback: ["openference/Claude Opus 5.5", deepseek/deepseek-v4-flash]}
      critic: {model: openrouter/openai/gpt-6.1-terra, fallback: [openrouter/google/gemini-3.8-flash, deepseek/deepseek-v4-flash]}
      designer: {model: openrouter/anthropic/claude-opus-5.5, fallback: [openrouter/anthropic/claude-sonnet-5.5, deepseek/deepseek-v4-flash]}
      coder: {model: openrouter/anthropic/claude-sonnet-5.5, fallback: [openrouter/z-ai/glm-5.3, deepseek/deepseek-v4-flash]}
      reviewer: {model: openrouter/openai/gpt-6.1-terra, fallback: [openrouter/anthropic/claude-haiku-5.5, deepseek/deepseek-v4-flash]}
default_profile: balanced

planner_role: orchestrator
reviewer_role: reviewer             # remove to skip reviews
critic_role: critic                 # remove to skip the plan critique
design_role: designer               # who designs the looks (default: a chat role named designer, else the planner)
scout_role: scout                   # who reads references (default: a chat role named scout, else the planner)
look_stage: auto                    # auto: offer three looks when the plan is an app with screens; off: only when asked
show_it: auto                       # auto: pictures of the app's own screens after every approved task; off: none
# prompts_dir: ./prompts            # override built-in prompts (orchestrator.md, coder.md, ...)

# USD per 1M tokens. Claude, DeepSeek and Openference prices are built in and OpenRouter's are
# read from OpenRouter; add the rest from each
# provider's pricing page so the budget covers them. Calls with no price are
# counted as "unpriced" and do NOT count toward max_cost_usd.
pricing:
  # myprovider/my-model: {input: 0.0, output: 0.0, cache_read: 0.0}
  # openai_images/gpt-image-1: {input: 0.0, output: 0.0}
  # Retro Diffusion reports the exact charge per image, so it needs no entry here.

limits:
  max_cost_usd: 10                  # per project; the run pauses when reached
  max_steps_per_task: 40            # model turns per attempt
  max_attempts_per_task: 3
  command_timeout: 120              # seconds per shell command

workspace:
  allow_shell: true                 # models may run commands in the project dir (NOT a sandbox)
  git: true                         # commit after every approved task

# Big tool results are slimmed before a model reads them; the full text is kept in
# .harness/spill and the model can fetch it back. `token_saver: false` turns it off.
# token_saver:
#   min_bytes: 1400                 # smaller results are left alone
#   keep_ratio_max: 0.72            # only replace when at least 28% smaller

# Plugins (docs/plugins.md): usually set with `roundtable plugin ...` or the app, which
# write them to custom.yaml. The token saver is the plugin `token-saver`.
# plugins:
#   cost-log: {enabled: true}       # each model call's tokens and cost in a CSV file

# Optional: report progress to the agent hub (Part 1)
# hub:
#   config: ~/agent-hub-data/hub.yaml
#   agent: harness

# Self-improvement (Part 3). See `roundtable improve --help`.
improve:
  auto_apply: none                  # none | low | medium: what `roundtable improve cycle` may apply on its own
  min_samples: 5                    # judged attempts needed before metrics-based routing changes
  probe_before_apply: true          # health-check involved models before applying a change
  # probes_file: ./probes.yaml      # your own probes (see `roundtable probe --help` / README)
  # analyst_role: orchestrator      # model that reads history and proposes changes (default: planner)
  # lab_dir: ./.harness-lab         # proposals, learned settings, versions

# Self-improvement: after each run, apply model switches the numbers clearly back (rules only,
# no model calls); each switch is written in the journal with its reason and undo command.
# improve: {after_each_run: true, auto_apply: low}
