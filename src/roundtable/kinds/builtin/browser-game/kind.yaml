schema: kind@1
id: browser-game
name: Browser game
blurb: Something to play in the browser.
group: Browser games
status: trial
extends: web-app
match: [game, games, arcade, puzzle, platformer, play, snake, tetris, pong, breakout, shooter, card game,
        idle, clicker, quiz, maze, high score, level, levels, jump]
examples: ["a snake game with a high score", "a card-matching puzzle", "a tiny platformer with three levels"]
needs: [playwright]
roles:
  add: {artist: {kind: image, description: "Draws the game's pictures"}}
  prompts: {orchestrator: prompts/planner.md, coder: prompts/coder.md, reviewer: prompts/reviewer.md}
plan:
  has_ui: true
  skeleton_first: true
  spec_sections: [Stack, Screens, Controls, Art style, Sound, How to run it]
  questions:
    - id: controls
      header: Controls
      question: "How is it played?"
      options: [{id: keyboard, label: "Keyboard"}, {id: mouse, label: "Mouse or touch"},
                {id: both, label: "Both"}]
      recommended: keyboard
  dont:
    - {text: "No game engine download", why: "It must open from one page"}
look: art
proof:
  - {id: starts, how: page_opens, words: "It opens with no errors"}
  - {id: tests, how: command, command: "npm test", optional: true, words: "Its tests pass"}
  - {id: plays, how: play, seconds: 60, words: "Played for a minute"}
estimate: {tasks: [6, 12], usd: [1.5, 4.0], minutes: [30, 90]}
