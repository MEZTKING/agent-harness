<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">

  <title>Roundtable Hold</title>
  <link rel="preload" href="fraunces.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="style.css">

  <script src="theme.js"></script>
</head>

  <a class="skip" href="#main">Skip to the page</a>

    <a class="brand" href="#/" title="Back to the Hall">
      <img class="brand-mark" src="emblem.png" width="36" height="36" alt="">
      <span class="brand-name">Roundtable Hold</span>
    </a>
    <nav class="rooms" aria-label="Rooms">
      <a href="#/" data-room="hall" title="Every project at the round table">Hall</a>
      <a href="#/needs" data-room="needs" title="Everything waiting for your answer">Needs you <span class="badge" id="needs-badge" hidden></span></a>

      <a href="#/letters" data-room="letters" title="Letters from your projects and agents">Letters <span class="badge soft" id="letters-badge" hidden></span></a>

    <div class="top-end">
      <a class="working" id="working" href="#/activity/work" title="Work the app is doing now" hidden><i class="cdl" aria-hidden="true"></i><span></span></a>

    </div>

  <div id="banner" class="banner" hidden></div>
  <main id="main" tabindex="-1"><p class="loading">Lighting the candles…</p></main>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
